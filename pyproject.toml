[project]
name = "repomind"
version = "0.1.0"
description = "RepoMind MVP: GitHub repository ingestion and RepoProfile generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "arq>=0.26",
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "qdrant-client>=1.9",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
parser = [
  "tree-sitter",
  "tree-sitter-javascript",
  "tree-sitter-language-pack",
  "tree-sitter-python",
  "tree-sitter-typescript",
]
storage = [
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
]
queue = [
  "arq>=0.26",
]
vector = [
  "qdrant-client>=1.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
